name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No global CGO_ENABLED=0: the race detector (-race) needs cgo. The Dockerfile
# builds the static release binary with CGO_ENABLED=0 on its own.

jobs:
  lint-and-unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify formatting
        run: |
          diff -u <(echo -n) <(gofmt -d -s .)

      - name: go vet
        run: go vet ./...

      # Pinned: staticcheck@latest needs a newer Go than this module's 1.23.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2024.1.1
          staticcheck ./...

      - name: Unit tests
        run: go test -race -count=1 -short ./...

  integration:
    name: Integration (Testcontainers)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Integration tests
        run: go test -race -count=1 -tags=integration ./test/integration/...

  image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: [lint-and-unit, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image references must be lowercase; the owner (ISch-1) is not.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/url-shortener" >> "$GITHUB_ENV"
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
